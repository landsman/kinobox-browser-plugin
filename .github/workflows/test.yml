name: PR

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Set up Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 'Install dependencies'
        run: make init

      - name: 'Run tests'
        run: make qa

      - name: 'Run Build'
        run: make build
