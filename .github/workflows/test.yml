name: PR

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
      
      - name: 'Set up Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@landsman'
          
      - name: 'Install dependencies'
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 'Run tests'
        run: npm test

      - name: 'Run Lint'
        run: npm run lint

      - name: 'Run Build'
        run: npm run build
